[package]
name = "tlsh-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Criterion benchmarks driving libhasher's TLSH kernel through FFI"
build = "build.rs"

[lib]
# only the Criterion harness runs under `cargo bench`
bench = false

[dependencies]

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tlsh"
harness = false
