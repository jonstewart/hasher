[workspace]
resolver = "2"
members = ["hset", "hset-cli", "hset-testkit"]
exclude = ["fuzz", "tlsh-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stroucki/libhasher"

[workspace.dependencies]
sha2 = "0.10"
thiserror = "2"
memmap2 = "0.9"
fearless_simd = { version = "1.0", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"
arbitrary = { version = "1.4", features = ["derive"] }
hset-testkit = { path = "hset-testkit" }

# hset carries #[cfg(kani)] mod proofs; declare the cfg here so clippy/rustc
# don't warn on it.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
lto = "thin"
codegen-units = 1
