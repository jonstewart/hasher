[workspace]
resolver = "2"
members = ["hset", "hset-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stroucki/libhasher"

[workspace.dependencies]
sha2 = "0.10"
thiserror = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
lto = "thin"
codegen-units = 1
